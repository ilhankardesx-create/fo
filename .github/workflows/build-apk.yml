name: Build Offline AI APK

on:
  push:
    branches: [ "offline-ai-apk-build" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Offline AI debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp offlineai/app/build/outputs/apk/debug/app-debug.apk Offline-AI-Prototype-0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-Prototype-0.1
          path: Offline-AI-Prototype-0.1.apk
