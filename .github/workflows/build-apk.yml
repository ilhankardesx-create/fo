name: Build FoldDesk RustDesk APK

on:
  push:
    branches: [ "folddesk-prototype" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUSTDESK_VERSION: "1.5.0"
      APK_NAME: "FoldDesk-v0.2-RustDesk.apk"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
      CARGO_EXPAND_VERSION: "1.0.95"

    steps:
      - name: Checkout FoldDesk patch
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust 1.75
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75'
          components: rustfmt

      - name: Set up Flutter 3.22.3 for RustDesk bridge
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Prepare Android SDK and bridge prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y clang libclang-dev llvm-dev cmake ninja-build pkg-config
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          flutter config --android-sdk "$ANDROID_SDK_ROOT"

      - name: Clone matching RustDesk source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --branch "$RUSTDESK_VERSION" --depth 1 https://github.com/rustdesk/rustdesk.git rustdesk
          git -C rustdesk submodule update --init --recursive --depth 1

      - name: Apply FoldDesk UI
        shell: bash
        run: |
          set -euxo pipefail
          python3 foldesk/patch_rustdesk.py rustdesk
          grep -n "FoldDeskShell" rustdesk/flutter/lib/mobile/pages/remote_page.dart
          grep -n "com.foldesk.remote" rustdesk/flutter/android/app/build.gradle

      - name: Fetch RustDesk native ARM64 core
        shell: bash
        run: |
          set -euxo pipefail
          APK="rustdesk-${RUSTDESK_VERSION}-aarch64-signed.apk"
          URL="https://github.com/rustdesk/rustdesk/releases/download/${RUSTDESK_VERSION}/${APK}"
          curl -fL --retry 3 --retry-delay 2 -o "$APK" "$URL"
          DEST="rustdesk/flutter/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          unzip -o -j "$APK" "lib/arm64-v8a/librustdesk.so" -d "$DEST"
          unzip -o -j "$APK" "lib/arm64-v8a/libc++_shared.so" -d "$DEST"
          file "$DEST/librustdesk.so"
          file "$DEST/libc++_shared.so"

      - name: Generate official RustDesk Flutter-Rust bridge
        shell: bash
        run: |
          set -euxo pipefail
          cd rustdesk
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          test -s flutter/lib/generated_bridge.dart
          test -s flutter/lib/generated_bridge.freezed.dart
          test -s src/bridge_generated.rs
          git checkout -- flutter/pubspec.yaml

      - name: Set up Flutter 3.24.5 for APK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Prepare Flutter 3.24.5 dependencies
        shell: bash
        run: |
          set -euxo pipefail
          flutter config --android-sdk "$ANDROID_SDK_ROOT"
          cd rustdesk/flutter
          flutter pub get
          flutter doctor -v

      - name: Increase Gradle heap for RustDesk assets
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rustdesk/flutter/android/gradle.properties')
          lines = p.read_text(encoding='utf-8').splitlines()
          prefixes = ('org.gradle.jvmargs=', 'kotlin.daemon.jvmargs=', 'org.gradle.workers.max=')
          lines = [line for line in lines if not line.startswith(prefixes)]
          lines += [
              'org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8',
              'kotlin.daemon.jvmargs=-Xmx1536M',
              'org.gradle.workers.max=1',
          ]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          PY

      - name: Build FoldDesk debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd rustdesk/flutter
          flutter build apk \
            --debug \
            --target-platform android-arm64 \
            --build-name 0.2.0 \
            --build-number 2

      - name: Package APK
        shell: bash
        run: |
          set -euxo pipefail
          cp rustdesk/flutter/build/app/outputs/flutter-apk/app-debug.apk "$APK_NAME"
          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Upload FoldDesk APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldDesk-v0.2-RustDesk
          path: |
            FoldDesk-v0.2-RustDesk.apk
            FoldDesk-v0.2-RustDesk.apk.sha256
          retention-days: 14
          if-no-files-found: error
