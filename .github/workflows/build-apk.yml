name: Build Offline AI APK

on:
  push:
    branches: [ "offline-ai-apk-build" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Offline AI debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp offlineai/app/build/outputs/apk/debug/app-debug.apk Offline-AI-Prototype-0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-Prototype-0.3
          path: Offline-AI-Prototype-0.3.apk
