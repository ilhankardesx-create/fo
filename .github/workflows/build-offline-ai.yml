name: Build Offline AI 0.6 APK

on:
  push:
    branches: [ "offline-ai-0.6-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        run: |
          cat parts/source.part01 parts/source.part02 parts/source.part03 parts/source.part04 parts/source.part05 | base64 -d > OfflineAI-Prototype-0.6-source.zip
          unzip -t OfflineAI-Prototype-0.6-source.zip
          mkdir project
          unzip -q OfflineAI-Prototype-0.6-source.zip -d project

      - name: Update Kotlin JVM target syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('''    kotlinOptions {\n        jvmTarget = "17"\n    }\n\n''', '')
          s += '''\n\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n'''
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Offline-AI-Prototype-0.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-Prototype-0.6
          path: Offline-AI-Prototype-0.6.apk
