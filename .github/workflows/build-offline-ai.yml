name: Build Offline AI 0.6 APK

on:
  push:
    branches: [ "offline-ai-0.6-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir project
          unzip -q OfflineAI-Prototype-0.6-source.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Offline-AI-Prototype-0.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-AI-Prototype-0.6
          path: Offline-AI-Prototype-0.6.apk
