name: BUILD110 Final Emulator Gate

on:
  push:
    branches: [ "offline-ai-build110" ]
    paths:
      - "offlineai110/prepare-final-verify.sh"
      - "offlineai110/emulator-final-verify.sh"
      - ".github/workflows/build-offline-ai-110-final.yml"
  workflow_dispatch:

jobs:
  final_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare exact BUILD110 production and validation APKs
        run: |
          chmod +x offlineai110/prepare-final-verify.sh offlineai110/emulator-final-verify.sh
          bash offlineai110/prepare-final-verify.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run corrected final emulator gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash offlineai110/emulator-final-verify.sh

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build110-final-evidence
          path: |
            emulator-status.txt
            emulator-normal-launch.png
            emulator-theme-before.png
            emulator-theme-after.png
            emulator-about.png
            emulator-stream-start.png
            emulator-stream-mid.png
            emulator-stream-finish.png
            theme-before.xml
            theme-after.xml
            theme-prefs.xml
            about.xml
            scroll-log.txt
            clean-androidruntime-errors.txt
            preview-androidruntime-errors.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: warn

      - name: Upload clean APK only after final gate passes
        uses: actions/upload-artifact@v4
        with:
          name: Internetsiz-Yapay-Zeka-build110-FINAL-EMULATOR-PASSED-apk
          path: Internetsiz-Yapay-Zeka-1.2-build110-FINAL-EMULATOR-PASSED.apk
          if-no-files-found: error
