name: BUILD112 Attachment Menu Release Gate

on:
  push:
    branches: [ "offline-ai-build112" ]
    paths:
      - "offlineai112/**"
      - ".github/workflows/build-offline-ai-112-release.yml"
  workflow_dispatch:

jobs:
  release_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Rebuild exact BUILD111 and create clean BUILD112
        run: bash offlineai112/prepare-build112.sh

      - name: Verify BUILD112 metadata and stage APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging project112/app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt | head -n 8
          grep -q "package: name='com.internetsizyapayzeka.app2026' versionCode='112' versionName='1.2'" apk-badging.txt
          cp project112/app/build/outputs/apk/debug/app-debug.apk Internetsiz-Yapay-Zeka-1.2-build112-ATTACHMENT-MENU-FIX.apk
          sha256sum Internetsiz-Yapay-Zeka-1.2-build112-ATTACHMENT-MENU-FIX.apk | tee apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run BUILD112 attachment menu emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash offlineai112/emulator-test.sh

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build112-attachment-menu-evidence
          path: |
            emulator-status.txt
            emulator-attachment-menu.png
            before.xml
            menu.xml
            plus-bounds.txt
            menu-bounds.txt
            app-logcat.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: warn

      - name: Upload APK only after emulator gate passes
        uses: actions/upload-artifact@v4
        with:
          name: Internetsiz-Yapay-Zeka-build112-ATTACHMENT-MENU-FIX-apk
          path: Internetsiz-Yapay-Zeka-1.2-build112-ATTACHMENT-MENU-FIX.apk
          if-no-files-found: error
