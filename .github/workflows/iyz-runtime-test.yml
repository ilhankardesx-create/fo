name: IYZ Runtime Launch Test

on:
  push:
    branches: [iyz-build105]
    paths:
      - '.github/workflows/iyz-runtime-test.yml'
  workflow_dispatch:

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct exact build105 source
        shell: bash
        run: |
          cat iyz-build105/source.part* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.zip
          unzip -t /tmp/source.zip
          mkdir -p /tmp/iyz
          unzip -q /tmp/source.zip -d /tmp/iyz
          cp iyz-build105/app-build.gradle.kts /tmp/iyz/Internetsiz-Yapay-Zeka-build105-source/app/build.gradle.kts
          MAIN=/tmp/iyz/Internetsiz-Yapay-Zeka-build105-source/app/src/main/java/com/offlineai/app/MainActivity.kt
          sed -i 's/ScrollView.LayoutParams(/FrameLayout.LayoutParams(/g' "$MAIN"
          sed -i 's/isTextSelectable = true/setTextIsSelectable(true)/' "$MAIN"

      - name: Build debug APK
        shell: bash
        run: |
          cd /tmp/iyz/Internetsiz-Yapay-Zeka-build105-source
          gradle --no-daemon clean assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            APK=/tmp/iyz/Internetsiz-Yapay-Zeka-build105-source/app/build/outputs/apk/debug/app-debug.apk
            PKG=com.internetsizyapayzeka.app2026
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG"
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof "$PKG" | tee /tmp/pid.txt || true
            adb logcat -d -v threadtime > /tmp/runtime-logcat.txt
            echo '===== CRASH LINES ====='
            grep -nE 'FATAL EXCEPTION|AndroidRuntime|Process: com.internetsizyapayzeka.app2026|Unable to start activity|ClassNotFoundException|NoClassDefFoundError|UnsatisfiedLinkError' /tmp/runtime-logcat.txt | tail -120 || true
            test -s /tmp/pid.txt
            ! grep -q 'FATAL EXCEPTION' /tmp/runtime-logcat.txt

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iyz-runtime-log
          path: /tmp/runtime-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
