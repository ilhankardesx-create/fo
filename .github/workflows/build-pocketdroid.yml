name: Build PocketDroid Prototype

on:
  push:
    branches: [ "pocketdroid-prototype" ]
    paths:
      - ".github/workflows/build-pocketdroid.yml"
      - "pocketdroid/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout PocketDroid branch
        uses: actions/checkout@v5

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 29 tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-29" \
            "build-tools;29.0.3"

      - name: Install ARM64 UEFI firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-efi-aarch64
          FW=$(find /usr/share -type f \( -name 'AAVMF_CODE.fd' -o -name 'QEMU_EFI.fd' \) | head -n 1)
          test -n "$FW"
          echo "Using ARM64 firmware: $FW"
          cp "$FW" /tmp/AAVMF_CODE.fd
          ls -lh /tmp/AAVMF_CODE.fd

      - name: Set up Java 11 for legacy emulator build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 7.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.0.2'

      - name: Prepare stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o /tmp/testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o /tmp/testkey.x509.pem
          openssl pkcs8 -inform DER -nocrypt -in /tmp/testkey.pk8 -out /tmp/testkey.pem
          openssl pkcs12 -export -in /tmp/testkey.x509.pem -inkey /tmp/testkey.pem -name androiddebugkey -out /tmp/testkey.p12 -passout pass:android
          keytool -importkeystore -noprompt \
            -srckeystore /tmp/testkey.p12 -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore "$HOME/.android/debug.keystore" -deststoretype JKS -deststorepass android \
            -alias androiddebugkey

      - name: Clone QEMU Android frontend
        run: |
          git clone --depth 1 --branch v6.0.1-LimboEmulator https://github.com/limboemu/limbo.git limbo

      - name: Import ARM64 QEMU guest binaries
        run: |
          curl -fL --retry 3 \
            https://github.com/limboemu/limbo/releases/download/v6.0.1-LimboEmulator/limbo-android-arm-6.0.1-qemu-5.1.0.apk \
            -o /tmp/limbo-arm-engine.apk
          mkdir -p /tmp/engine-libs
          unzip -q /tmp/limbo-arm-engine.apk 'lib/arm64-v8a/*' -d /tmp/engine-libs
          mkdir -p limbo/limbo-android-arm/src/main/jniLibs/arm64-v8a
          cp /tmp/engine-libs/lib/arm64-v8a/*.so limbo/limbo-android-arm/src/main/jniLibs/arm64-v8a/
          test -f limbo/limbo-android-arm/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so

      - name: Overlay PocketDroid UI and firmware
        run: |
          mkdir -p limbo/limbo-android-arm/src/main/java/com/max2idea/android/limbo/machine
          cp pocketdroid/PocketDroidActivity.java \
            limbo/limbo-android-arm/src/main/java/com/max2idea/android/limbo/machine/PocketDroidActivity.java
          cp pocketdroid/AndroidManifest.xml \
            limbo/limbo-android-arm/src/main/AndroidManifest.xml
          mkdir -p limbo/limbo-android-arm/src/main/assets/pocketdroid
          cp /tmp/AAVMF_CODE.fd \
            limbo/limbo-android-arm/src/main/assets/pocketdroid/AAVMF_CODE.fd

      - name: Brand and tune PocketDroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path('limbo/limbo-android-arm/src/main/res/values/strings.xml')
          s = strings.read_text()
          s = s.replace('Limbo ARM Emulator', 'PocketDroid')
          s = s.replace('Limbo ARM', 'PocketDroid')
          strings.write_text(s)

          config = Path('limbo/limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/Config.java')
          c = config.read_text()
          c = c.replace('public static final String APP_NAME = "Limbo Emulator";',
                        'public static final String APP_NAME = "PocketDroid";')
          config.write_text(c)

          activity = Path('limbo/limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java')
          a = activity.read_text()
          a = a.replace('        checkFirstLaunch();\n', '')
          a = a.replace('        checkUpdate();\n', '')
          a = a.replace('        checkLog();\n', '')
          activity.write_text(a)

          app = Path('limbo/limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboApplication.java')
          la = app.read_text()
          la = la.replace('context.getClass().getPackage().getName()', 'context.getPackageName()')
          app.write_text(la)

          gradle_file = Path('limbo/limbo-android-arm/build.gradle')
          g = gradle_file.read_text()
          g = g.replace('applicationId "com.limbo.emu.main.arm"', 'applicationId "com.pocketdroid.vm"')
          g = g.replace('ndk { abiFilters "armeabi-v7a","arm64-v8a", "x86", "x86_64" }',
                        'ndk { abiFilters "arm64-v8a" }')
          gradle_file.write_text(g)

          root = Path('limbo/build.gradle')
          root.write_text(root.read_text().replace('jcenter()', 'mavenCentral()'))
          PY

      - name: Build PocketDroid APK
        working-directory: limbo
        run: gradle :limbo-android-arm:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          APK=$(find limbo/limbo-android-arm/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" PocketDroid-Prototype-v0.5.apk
          ls -lh PocketDroid-Prototype-v0.5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketDroid-Prototype-v0.5
          path: PocketDroid-Prototype-v0.5.apk
          retention-days: 30
