name: Verify BUILD110 and publish APK

on:
  push:
    branches: [ "offline-ai-build110" ]
    paths:
      - "offlineai110/**"
      - ".github/workflows/build-offline-ai-110-verify.yml"
  workflow_dispatch:

jobs:
  verify_build110:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_PACKAGE: com.internetsizyapayzeka.app2026
      ACTIVITY: com.offlineai.app.MainActivity
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct BUILD110 production source
        run: |
          cat offlineai108/chunk_00.b64 offlineai108/chunk_01.b64 offlineai108/chunk_02.b64 offlineai108/chunk_03.b64 offlineai108/chunk_04.b64 | base64 -d > base108.zip
          echo "cd9564a71b2b6e8e119d2851788ecd27d7a173cd246b7749169bd1c9a0ac0e88  base108.zip" | sha256sum -c -
          rm -rf project110
          mkdir project110
          unzip -q base108.zip -d project110
          chmod +x project110/gradlew
          FILE="project110/app/src/main/java/com/offlineai/app/MainActivity.kt"
          sed -i 's/ScrollView\.LayoutParams(/FrameLayout.LayoutParams(/g' "$FILE"
          sed -i 's/isTextSelectable = true/setTextIsSelectable(true)/g' "$FILE"
          python - <<'PY'
          from pathlib import Path
          p=Path('project110/app/src/main/java/com/offlineai/app/MainActivity.kt')
          s=p.read_text()
          old='''        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n            val appearance = if (isDarkTheme) 0 else WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS\n            window.insetsController?.setSystemBarsAppearance(appearance, WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS)\n        }\n        PDFBoxResourceLoader.init(applicationContext)\n        engine = LocalModelEngine(this)\n        registerDownloadReceiver()\n        buildUi()\n        restoreModel()\n'''
          new='''        PDFBoxResourceLoader.init(applicationContext)\n        engine = LocalModelEngine(this)\n        registerDownloadReceiver()\n        buildUi()\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n            val appearance = if (isDarkTheme) 0 else WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS\n            window.insetsController?.setSystemBarsAppearance(appearance, WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS)\n        }\n        restoreModel()\n'''
          if old not in s: raise SystemExit('BUILD108 startup anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          patch -d project110 -p1 < offlineai109/build109-ui.patch
          echo "bdfcbcdd3310e39d019be2d9a5ac007d9b143c0c56fcec5d500afb7f5cc406c3  project110/app/src/main/java/com/offlineai/app/MainActivity.kt" | sha256sum -c -
          echo "9cba84c3d35e55d3eb66c706bcf03a8b48e59571bca751a7a0231a1c9077d12b  project110/app/build.gradle.kts" | sha256sum -c -
          patch -d project110 -p1 < offlineai110/build110-fixes.patch
          echo "48b8e03a66b609ed3119e7a9d73fd665d2ed4245dea5612fe8cbdfcb73a40dfc  project110/app/src/main/java/com/offlineai/app/MainActivity.kt" | sha256sum -c -
          echo "8a24afa5d29f6cc097ca415c16206b02f14eb07f2e9af4dbccf2a8168d001e74  project110/app/build.gradle.kts" | sha256sum -c -
          grep -q 'versionCode = 110' project110/app/build.gradle.kts
          grep -q 'İlhan Kardeş' "$FILE"
          grep -q 'ilhankardesx@gmail.com' "$FILE"
          grep -q 'KULLANIM KILAVUZU' "$FILE"
          grep -q 'scrollToBottom(force = false)' "$FILE"
          ! grep -q 'recreate()' "$FILE"
          ! grep -q 'fullScroll(' "$FILE"

      - name: Build clean BUILD110 APK
        working-directory: project110
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify metadata and stage clean APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging project110/app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt | head -n 8
          grep -q "package: name='com.internetsizyapayzeka.app2026' versionCode='110' versionName='1.2'" apk-badging.txt
          cp project110/app/build/outputs/apk/debug/app-debug.apk Internetsiz-Yapay-Zeka-1.2-build110-EMULATOR-PASSED.apk
          sha256sum Internetsiz-Yapay-Zeka-1.2-build110-EMULATOR-PASSED.apk | tee apk-sha256.txt

      - name: Build emulator-only validation APK
        run: |
          rm -rf project110-preview
          cp -a project110 project110-preview
          python - <<'PY'
          from pathlib import Path
          p=Path('project110-preview/app/src/main/java/com/offlineai/app/MainActivity.kt')
          s=p.read_text()
          needle='''        restoreModel()\n    }\n\n    private fun registerDownloadReceiver()'''
          hook='''        restoreModel()\n        when {\n            intent.getBooleanExtra("__theme_preserve_test", false) -> {\n                switchToConversation()\n                currentChatLines.clear()\n                currentChatLines += ChatLine("user", "BUILD110_TEMA_KORUMA_KULLANICI")\n                currentChatLines += ChatLine("assistant", "BUILD110_TEMA_KORUMA_ASISTAN")\n                renderCurrentChatLines()\n                input.setText("BUILD110_TASLAK_KORUNDU")\n                root.postDelayed({ toggleTheme() }, 3500L)\n            }\n            intent.getBooleanExtra("__about_test", false) -> root.postDelayed({ showAbout() }, 800L)\n            intent.getBooleanExtra("__scroll_stream_test", false) -> {\n                switchToConversation()\n                addUserBubble("BUILD110 uzun yanıt kaydırma testi")\n                root.postDelayed({\n                    conversationScroll.setOnScrollChangeListener { _, _, y, _, oldY -> android.util.Log.d("BUILD110_SCROLL", "old=$oldY y=$y") }\n                    val assistant=addAssistantMessage()\n                    assistant.thinking.stopAndHide()\n                    assistant.answer.visibility=View.VISIBLE\n                    scrollToBottom(force=true)\n                    val typing=TypingSession(this@MainActivity, assistant.answer) { scrollToBottom(force=false) }\n                    launch {\n                        repeat(70) { index ->\n                            typing.append("Akış ${index + 1}: Uzun yanıt ekranda kararlı biçimde aşağı ilerlemeli; önceki satırlara geri sıçramamalıdır. ")\n                            delay(18L)\n                        }\n                        typing.complete()\n                        typing.awaitFinished()\n                        android.util.Log.d("BUILD110_SCROLL", "DONE y=${conversationScroll.scrollY}")\n                    }\n                }, 700L)\n            }\n        }\n    }\n\n    private fun registerDownloadReceiver()'''
          if needle not in s: raise SystemExit('preview hook anchor missing')
          p.write_text(s.replace(needle,hook,1))
          PY
          cd project110-preview
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Create emulator validation script
        run: |
          cat > emulator-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          CLEAN_APK="Internetsiz-Yapay-Zeka-1.2-build110-EMULATOR-PASSED.apk"
          PREVIEW_APK="project110-preview/app/build/outputs/apk/debug/app-debug.apk"
          PKG="com.internetsizyapayzeka.app2026"
          ACT="com.offlineai.app.MainActivity"
          : > emulator-status.txt

          echo '=== CLEAN LAUNCH ===' | tee -a emulator-status.txt
          adb install -r "$CLEAN_APK"
          adb logcat -c
          adb shell am force-stop "$PKG" || true
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 8
          PID="$(adb shell pidof "$PKG" | tr -d '\r' || true)"
          test -n "$PID"
          echo "CLEAN_PID=$PID" | tee -a emulator-status.txt
          adb exec-out screencap -p > emulator-normal-launch.png
          adb logcat -d AndroidRuntime:E '*:S' > clean-androidruntime-errors.txt || true
          ! grep -q 'FATAL EXCEPTION' clean-androidruntime-errors.txt
          ! grep -q "Process: $PKG" clean-androidruntime-errors.txt

          echo '=== THEME PRESERVE ===' | tee -a emulator-status.txt
          adb install -r "$PREVIEW_APK"
          adb shell am force-stop "$PKG" || true
          adb shell am start -n "$PKG/$ACT" --ez __theme_preserve_test true
          sleep 2
          PID_BEFORE="$(adb shell pidof "$PKG" | tr -d '\r')"
          adb shell uiautomator dump /sdcard/theme-before.xml >/dev/null
          adb pull /sdcard/theme-before.xml theme-before.xml >/dev/null
          grep -q 'BUILD110_TEMA_KORUMA_KULLANICI' theme-before.xml
          grep -q 'BUILD110_TEMA_KORUMA_ASISTAN' theme-before.xml
          grep -q 'BUILD110_TASLAK_KORUNDU' theme-before.xml
          adb exec-out screencap -p > emulator-theme-before.png
          sleep 4
          PID_AFTER="$(adb shell pidof "$PKG" | tr -d '\r')"
          test "$PID_BEFORE" = "$PID_AFTER"
          adb shell uiautomator dump /sdcard/theme-after.xml >/dev/null
          adb pull /sdcard/theme-after.xml theme-after.xml >/dev/null
          grep -q 'BUILD110_TEMA_KORUMA_KULLANICI' theme-after.xml
          grep -q 'BUILD110_TEMA_KORUMA_ASISTAN' theme-after.xml
          grep -q 'BUILD110_TASLAK_KORUNDU' theme-after.xml
          adb shell run-as "$PKG" cat shared_prefs/offline_ai_prefs.xml > theme-prefs.xml
          grep -q 'name="dark_theme" value="false"' theme-prefs.xml
          adb exec-out screencap -p > emulator-theme-after.png
          echo "THEME_PID=$PID_BEFORE" | tee -a emulator-status.txt

          echo '=== ABOUT ===' | tee -a emulator-status.txt
          adb shell am force-stop "$PKG" || true
          adb shell am start -n "$PKG/$ACT" --ez __about_test true
          sleep 3
          adb shell uiautomator dump /sdcard/about.xml >/dev/null
          adb pull /sdcard/about.xml about.xml >/dev/null
          grep -q 'İlhan Kardeş' about.xml
          grep -q 'ilhankardesx@gmail.com' about.xml
          grep -q 'KULLANIM KILAVUZU' about.xml
          adb exec-out screencap -p > emulator-about.png

          echo '=== LONG STREAM ===' | tee -a emulator-status.txt
          adb logcat -c
          adb shell am force-stop "$PKG" || true
          adb shell am start -n "$PKG/$ACT" --ez __scroll_stream_test true
          adb exec-out screencap -p > emulator-stream-start.png
          DONE=0
          for i in $(seq 1 30); do
            sleep 1
            adb logcat -d -s BUILD110_SCROLL:D '*:S' > scroll-log.txt || true
            if grep -q 'DONE y=' scroll-log.txt; then DONE=1; break; fi
          done
          test "$DONE" = "1"
          STREAM_PID="$(adb shell pidof "$PKG" | tr -d '\r' || true)"
          test -n "$STREAM_PID"
          python - <<'PY'
          import re,sys
          vals=[]
          for line in open('scroll-log.txt',encoding='utf-8',errors='ignore'):
              m=re.search(r'old=(\d+) y=(\d+)',line)
              if m: vals.append(int(m.group(2)))
          print('samples',len(vals),'first',vals[:3],'last',vals[-3:] if vals else [])
          if len(vals)<5: sys.exit(1)
          drops=[(a,b) for a,b in zip(vals,vals[1:]) if b<a-4]
          print('drops',drops[:10])
          if drops or vals[-1] <= vals[0]: sys.exit(1)
          PY
          adb exec-out screencap -p > emulator-stream-finish.png
          adb logcat -d AndroidRuntime:E '*:S' > preview-androidruntime-errors.txt || true
          ! grep -q 'FATAL EXCEPTION' preview-androidruntime-errors.txt
          ! grep -q "Process: $PKG" preview-androidruntime-errors.txt

          echo 'PASS: BUILD110 clean launch + theme/chat/draft preserved + About + monotonic long-answer scroll + no crash' | tee -a emulator-status.txt
          EOF
          chmod +x emulator-test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash emulator-test.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build110-verified-evidence
          path: |
            emulator-status.txt
            emulator-normal-launch.png
            emulator-theme-before.png
            emulator-theme-after.png
            emulator-about.png
            emulator-stream-start.png
            emulator-stream-finish.png
            theme-before.xml
            theme-after.xml
            theme-prefs.xml
            about.xml
            scroll-log.txt
            clean-androidruntime-errors.txt
            preview-androidruntime-errors.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: warn

      - name: Upload clean APK after verification
        uses: actions/upload-artifact@v4
        with:
          name: Internetsiz-Yapay-Zeka-build110-VERIFIED-apk
          path: Internetsiz-Yapay-Zeka-1.2-build110-EMULATOR-PASSED.apk
          if-no-files-found: error
