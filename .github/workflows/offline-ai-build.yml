name: Offline AI clean APK

on:
  push:
    branches: [offline-ai-clean-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-ai-clean-build

      - name: Hydrate Offline AI 0.9.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p offline-ai/app/src/main/java/com/offlineai/app
          rm -rf offline-ai/app/src/main/res/mipmap-xxxhdpi
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/54d1764e7646465c2840e0af33645adc0bb42b54" \
            | jq -r '.content' | tr -d '\n' | base64 -d \
            > offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          sed -i 's/com.tom_roush.pdfbox.util.PDFBoxResourceLoader/com.tom_roush.pdfbox.android.PDFBoxResourceLoader/' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          python3 offline-ai/patch_093.py
          python3 offline-ai/patch_094.py
          test -s offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          test -s offline-ai/app/src/main/java/com/offlineai/app/SamsungPerformanceBoost.kt
          grep -q 'showModelsDialog' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'extractPdfText' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'POWER_MODEL_URL' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'Gemma 4 12B' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'samsungPerformanceBoost.start()' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'KEY_LIGHT_THEME' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'Koyu tema' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'LinearLayout.LayoutParams(dp(52), dp(52))' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep -q 'com.tom_roush.pdfbox.android.PDFBoxResourceLoader' offline-ai/app/src/main/java/com/offlineai/app/MainActivity.kt
          test -s offline-ai/app/src/main/res/drawable/ic_app_logo.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: offline-ai
        run: gradle :app:assembleRelease --stacktrace

      - name: Export Android Build Tools signer
        run: |
          mkdir -p offline-ai/sign-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" offline-ai/sign-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" offline-ai/sign-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" offline-ai/sign-tools/zipalign

      - uses: actions/upload-artifact@v4
        with:
          name: offline-ai-0.9.4-unsigned
          path: offline-ai/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools-36
          path: offline-ai/sign-tools
          if-no-files-found: error
