name: Build FoldLinux Prototype APK

on:
  push:
    branches: [ "foldlinux-prototype" ]
    paths:
      - "foldlinux/**"
      - ".github/workflows/build-foldlinux.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout FoldLinux overlay
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Prepare stable prototype signing key
        run: |
          mkdir -p "$HOME/.android"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o /tmp/testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o /tmp/testkey.x509.pem
          openssl pkcs8 -inform DER -nocrypt -in /tmp/testkey.pk8 -out /tmp/testkey.pem
          openssl pkcs12 -export -in /tmp/testkey.x509.pem -inkey /tmp/testkey.pem -name androiddebugkey -out /tmp/testkey.p12 -passout pass:android
          keytool -importkeystore -noprompt \
            -srckeystore /tmp/testkey.p12 -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore "$HOME/.android/debug.keystore" -deststoretype JKS -deststorepass android \
            -alias androiddebugkey

      - name: Clone PRoot engine
        run: |
          git clone --depth 1 https://github.com/oonid/pr.git upstream-pr
          git -C upstream-pr submodule update --init --depth 1 vendor/termlib

      - name: Apply FoldLinux UI
        run: |
          cp foldlinux/MainActivity.kt upstream-pr/android/app/src/main/java/id/or/oo/pr/MainActivity.kt
          cp foldlinux/TerminalActivity.kt upstream-pr/android/app/src/main/java/id/or/oo/pr/TerminalActivity.kt
          cp foldlinux/DesktopActivity.kt upstream-pr/android/app/src/main/java/id/or/oo/pr/DesktopActivity.kt
          cp foldlinux/AndroidManifest.xml upstream-pr/android/app/src/main/AndroidManifest.xml
          cp foldlinux/strings.xml upstream-pr/android/app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream-pr/android/app/src/main/java/id/or/oo/pr/MainActivity.kt')
          s = p.read_text()
          s = s.replace('private const val DESKTOP_INSTALL_COMMAND =', 'private val DESKTOP_INSTALL_COMMAND =')
          s = s.replace('if [ $CODE -eq 0 ]', 'if [ \\$CODE -eq 0 ]')
          p.write_text(s)
          PY
          sed -i 's/>FoldLinux</>FoldLinux Dev</' upstream-pr/android/app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "id.or.oo.pr"/applicationId = "com.foldlinux.prototype"/' upstream-pr/android/app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 4/' upstream-pr/android/app/build.gradle.kts
          sed -i 's/versionName = "1.0.0"/versionName = "0.4-prototype"/' upstream-pr/android/app/build.gradle.kts
          sed -i '/implementation(project(":proot-engine"))/i\    implementation("org.apache.commons:commons-compress:1.27.1")' upstream-pr/android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: upstream-pr/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk FoldLinux-Prototype-v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldLinux-Prototype-v0.4
          path: FoldLinux-Prototype-v0.4.apk
