name: Build FoldLinux Prototype APK

on:
  push:
    branches: [ "foldlinux-prototype" ]
    paths:
      - "foldlinux/**"
      - ".github/workflows/build-foldlinux.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout FoldLinux overlay
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Clone PRoot engine
        run: |
          git clone --depth 1 https://github.com/oonid/pr.git upstream-pr
          git -C upstream-pr submodule update --init --depth 1 vendor/termlib

      - name: Apply FoldLinux UI
        run: |
          cp foldlinux/MainActivity.kt upstream-pr/android/app/src/main/java/id/or/oo/pr/MainActivity.kt
          cp foldlinux/AndroidManifest.xml upstream-pr/android/app/src/main/AndroidManifest.xml
          cp foldlinux/strings.xml upstream-pr/android/app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "id.or.oo.pr"/applicationId = "com.foldlinux.app"/' upstream-pr/android/app/build.gradle.kts
          sed -i 's/versionCode = 1/versionCode = 2/' upstream-pr/android/app/build.gradle.kts
          sed -i 's/versionName = "1.0.0"/versionName = "0.2-prototype"/' upstream-pr/android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream-pr/android/app/src/main/java/id/or/oo/pr/MainActivity.kt')
          s = p.read_text()
          old = '''        process.inputStream.bufferedReader().useLines { lines ->
              lines.forEach { raw ->
                  val line = raw.trim()
                  if (line.isNotEmpty()) {
                      withContext(Dispatchers.Main) { onLine(line) }
                  }
              }
          }
'''
          if old not in s:
              raise SystemExit('expected tar output block not found')
          p.write_text(s.replace(old, '        process.inputStream.close()\n'))
          PY

      - name: Build debug APK
        working-directory: upstream-pr/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp upstream-pr/android/app/build/outputs/apk/debug/app-debug.apk FoldLinux-Prototype-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldLinux-Prototype-v0.2
          path: FoldLinux-Prototype-v0.2.apk
