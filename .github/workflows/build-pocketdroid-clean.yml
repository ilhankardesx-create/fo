name: Build PocketDroid Clean

on:
  push:
    branches: [ "pocketdroid-prototype" ]
    paths:
      - "pocketdroid-clean/**"
      - ".github/workflows/build-pocketdroid-clean.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o /tmp/testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o /tmp/testkey.x509.pem
          openssl pkcs8 -inform DER -nocrypt -in /tmp/testkey.pk8 -out /tmp/testkey.pem
          openssl pkcs12 -export -in /tmp/testkey.x509.pem -inkey /tmp/testkey.pem -name androiddebugkey -out /tmp/testkey.p12 -passout pass:android
          keytool -importkeystore -noprompt \
            -srckeystore /tmp/testkey.p12 -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore "$HOME/.android/debug.keystore" -deststoretype JKS -deststorepass android \
            -alias androiddebugkey

      - name: Import complete Limbo ARM64 runtime and ROM data
        run: |
          curl -fL --retry 3 \
            https://github.com/limboemu/limbo/releases/download/v6.0.1-LimboEmulator/limbo-android-arm-6.0.1-qemu-5.1.0.apk \
            -o /tmp/qemu-arm-runtime.apk

          rm -rf /tmp/qemu-runtime
          mkdir -p /tmp/qemu-runtime
          unzip -q /tmp/qemu-arm-runtime.apk 'lib/arm64-v8a/*' 'assets/roms/*' -d /tmp/qemu-runtime

          mkdir -p pocketdroid-clean/app/src/main/jniLibs/arm64-v8a
          cp /tmp/qemu-runtime/lib/arm64-v8a/*.so pocketdroid-clean/app/src/main/jniLibs/arm64-v8a/

          mkdir -p pocketdroid-clean/app/src/main/assets/roms
          cp -a /tmp/qemu-runtime/assets/roms/. pocketdroid-clean/app/src/main/assets/roms/

          RUNTIME=pocketdroid-clean/app/src/main/jniLibs/arm64-v8a
          test -f "$RUNTIME/libqemu-system-aarch64.so"
          test -f "$RUNTIME/liblimbo.so"
          test -f "$RUNTIME/libcompat-limbo.so"
          test -f "$RUNTIME/libcompat-musl.so"
          test -f "$RUNTIME/libglib-2.0.so"
          test -f "$RUNTIME/libpixman-1.so"
          test -f "$RUNTIME/libcompat-SDL2-addons.so"
          test -f "$RUNTIME/libSDL2.so"
          test -f "$RUNTIME/libcompat-SDL2-ext.so"

          ROM_COUNT=$(find pocketdroid-clean/app/src/main/assets/roms -type f | wc -l)
          echo "Limbo ROM/keymap files: $ROM_COUNT"
          test "$ROM_COUNT" -gt 5
          find pocketdroid-clean/app/src/main/assets/roms -type f | head -n 30

          echo "PocketDroid v1.3 native runtime:"
          ls -lh "$RUNTIME"/libqemu-system-aarch64.so \
                 "$RUNTIME"/liblimbo.so \
                 "$RUNTIME"/libcompat-limbo.so \
                 "$RUNTIME"/libcompat-musl.so \
                 "$RUNTIME"/libcompat-SDL2-addons.so \
                 "$RUNTIME"/libSDL2.so \
                 "$RUNTIME"/libcompat-SDL2-ext.so
          echo "QEMU dependencies:"
          readelf -d "$RUNTIME/libqemu-system-aarch64.so" | grep NEEDED || true
          echo "Limbo JNI symbols:"
          readelf -Ws "$RUNTIME/liblimbo.so" | grep 'Java_com_max2idea_android_limbo_jni_VMExecutor_start'

      - name: Add ARM64 AAVMF firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-efi-aarch64

          FW=$(readlink -f /usr/share/AAVMF/AAVMF_CODE.fd)
          test -f "$FW"
          SIZE=$(stat -c%s "$FW")
          echo "AAVMF_CODE.fd target: $FW"
          echo "AAVMF_CODE.fd size: $SIZE bytes"
          test "$SIZE" -eq 67108864

          mkdir -p pocketdroid-clean/app/src/main/assets
          cp "$FW" pocketdroid-clean/app/src/main/assets/AAVMF_CODE.fd
          test "$(stat -c%s pocketdroid-clean/app/src/main/assets/AAVMF_CODE.fd)" -eq 67108864
          ls -lh pocketdroid-clean/app/src/main/assets/AAVMF_CODE.fd

      - name: Apply diagnostics UI
        run: python3 pocketdroid-clean/patch_v08.py

      - name: Apply Limbo native boot
        run: python3 pocketdroid-clean/patch_v10.py

      - name: Apply v1.1 UEFI firmware fix
        run: python3 pocketdroid-clean/patch_v11.py

      - name: Apply v1.2 UTM EFI vars fix
        run: python3 pocketdroid-clean/patch_v12.py

      - name: Apply v1.3 Limbo ROM and argv diagnostics
        run: python3 pocketdroid-clean/patch_v13.py

      - name: Build PocketDroid v1.3
        run: gradle -p pocketdroid-clean :app:assembleDebug --stacktrace

      - name: Verify packaged runtime firmware and ROM data
        run: |
          APK=$(find pocketdroid-clean/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libqemu-system-aarch64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/liblimbo.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libcompat-limbo.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libcompat-SDL2-addons.so'
          unzip -l "$APK" | grep 'assets/AAVMF_CODE.fd'
          ROMS_IN_APK=$(unzip -l "$APK" | grep -c 'assets/roms/' || true)
          echo "ROM entries packaged: $ROMS_IN_APK"
          test "$ROMS_IN_APK" -gt 5

      - name: Package APK
        run: |
          APK=$(find pocketdroid-clean/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" PocketDroid-Clean-v1.3.apk
          ls -lh PocketDroid-Clean-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketDroid-Clean-v1.3
          path: PocketDroid-Clean-v1.3.apk
          retention-days: 30
