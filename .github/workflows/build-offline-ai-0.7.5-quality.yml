name: Build İnternetsiz Yapay Zeka 0.7.5 Quality Fix APK

on:
  push:
    branches: [ "offline-ai-0.6-build" ]
    paths:
      - ".github/workflows/build-offline-ai-0.7.5-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        run: |
          cat parts/source.part01 parts/source.part02 parts/source.part03 parts/source.part04 parts/source.part05 | base64 -d > source.zip
          unzip -t source.zip
          mkdir project
          unzip -q source.zip -d project

      - name: Apply 0.7.5 quality fixes
        run: |
          cp hotfix/MainActivity_0_6_2.kt project/app/src/main/java/com/offlineai/app/MainActivity.kt
          cp hotfix/LocalModelEngine_0_7_5.kt project/app/src/main/java/com/offlineai/app/LocalModelEngine.kt
          python3 hotfix/patch_0_6_3.py
          python3 hotfix/patch_0_6_4.py
          python3 hotfix/patch_0_7_0.py
          python3 hotfix/patch_0_7_1.py
          python3 hotfix/patch_0_7_1_compile_fix.py
          python3 hotfix/patch_0_7_2.py
          python3 hotfix/patch_0_7_5.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in [
              Path("project/app/src/main/AndroidManifest.xml"),
              Path("project/app/src/main/res/values/strings.xml"),
              Path("project/app/src/main/java/com/offlineai/app/MainActivity.kt"),
          ]:
              if path.exists():
                  text = path.read_text().replace("Offline AI", "İnternetsiz Yapay Zeka")
                  path.write_text(text)

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('''    kotlinOptions {\n        jvmTarget = "17"\n    }\n\n''', '')
          if 'compilerOptions' not in s:
              s += '''\n\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n'''
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 15', s)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.7.5-quality-test"', s)
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build test APK
        run: gradle -p project :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Internetsiz-Yapay-Zeka-0.7.5-quality-test.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Internetsiz-Yapay-Zeka-0.7.5-quality-test
          path: Internetsiz-Yapay-Zeka-0.7.5-quality-test.apk
