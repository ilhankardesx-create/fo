name: Interkom APK prototype
on:
  workflow_dispatch:
  push:
    branches: [interkom-v01-first-apk]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: interkom
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: interkom-build1-debug-apk
          path: interkom/app/build/outputs/apk/debug/app-debug.apk
