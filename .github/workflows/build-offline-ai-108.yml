name: Build and Emulator-Test Offline AI 108 APK

on:
  push:
    branches: [ "offline-ai-build108" ]
    paths:
      - "offlineai108/**"
      - ".github/workflows/build-offline-ai-108.yml"
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_PACKAGE: com.internetsizyapayzeka.app2026
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Reconstruct and verify source ZIP
        run: |
          cat offlineai108/chunk_00.b64 \
              offlineai108/chunk_01.b64 \
              offlineai108/chunk_02.b64 \
              offlineai108/chunk_03.b64 \
              offlineai108/chunk_04.b64 \
              | base64 -d > offlineai108-source.zip
          echo "cd9564a71b2b6e8e119d2851788ecd27d7a173cd246b7749169bd1c9a0ac0e88  offlineai108-source.zip" | sha256sum -c -
          rm -rf project108
          mkdir project108
          unzip -q offlineai108-source.zip -d project108
          chmod +x project108/gradlew

      - name: Apply Kotlin compile fixes
        run: |
          FILE="project108/app/src/main/java/com/offlineai/app/MainActivity.kt"
          sed -i 's/ScrollView\.LayoutParams(/FrameLayout.LayoutParams(/g' "$FILE"
          sed -i 's/isTextSelectable = true/setTextIsSelectable(true)/g' "$FILE"
          ! grep -q 'ScrollView.LayoutParams' "$FILE"
          ! grep -q 'isTextSelectable = true' "$FILE"

      - name: Apply startup crash fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project108/app/src/main/java/com/offlineai/app/MainActivity.kt')
          s = p.read_text()
          old = '''        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n            val appearance = if (isDarkTheme) 0 else WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS\n            window.insetsController?.setSystemBarsAppearance(appearance, WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS)\n        }\n        PDFBoxResourceLoader.init(applicationContext)\n        engine = LocalModelEngine(this)\n        registerDownloadReceiver()\n        buildUi()\n        restoreModel()\n'''
          new = '''        PDFBoxResourceLoader.init(applicationContext)\n        engine = LocalModelEngine(this)\n        registerDownloadReceiver()\n        buildUi()\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n            val appearance = if (isDarkTheme) 0 else WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS\n            window.insetsController?.setSystemBarsAppearance(appearance, WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS)\n        }\n        restoreModel()\n'''
          if old not in s:
              raise SystemExit('startup block not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          nl -ba project108/app/src/main/java/com/offlineai/app/MainActivity.kt | sed -n '175,192p'

      - name: Build debug APK
        working-directory: project108
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK metadata
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging project108/app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt | head -n 8
          grep -q "package: name='com.internetsizyapayzeka.app2026' versionCode='108' versionName='1.2'" apk-badging.txt
          sha256sum project108/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Create emulator launch-test script
        run: |
          cat > emulator-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="project108/app/build/outputs/apk/debug/app-debug.apk"
          APP_PACKAGE="com.internetsizyapayzeka.app2026"

          echo "Installing APK: $APK"
          test -f "$APK"
          adb install -r "$APK"
          adb shell pm list packages | grep -F "$APP_PACKAGE"

          adb logcat -c
          adb shell am force-stop "$APP_PACKAGE" || true
          adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1
          sleep 10

          PID="$(adb shell pidof "$APP_PACKAGE" | tr -d '\r' || true)"
          echo "APP_PID=$PID" | tee emulator-status.txt

          adb shell dumpsys activity activities > emulator-activities.txt || true
          adb exec-out screencap -p > emulator-launch.png || true
          adb logcat -d > emulator-logcat.txt || true
          adb logcat -d AndroidRuntime:E '*:S' > androidruntime-errors.txt || true

          if [ -z "$PID" ]; then
            echo "ERROR: App process is not alive after launch" | tee -a emulator-status.txt
            cat androidruntime-errors.txt || true
            exit 1
          fi

          if grep -q "FATAL EXCEPTION" androidruntime-errors.txt; then
            echo "ERROR: AndroidRuntime fatal exception detected" | tee -a emulator-status.txt
            cat androidruntime-errors.txt
            exit 1
          fi

          if grep -q "Process: $APP_PACKAGE" androidruntime-errors.txt; then
            echo "ERROR: AndroidRuntime process crash detected" | tee -a emulator-status.txt
            cat androidruntime-errors.txt
            exit 1
          fi

          if ! grep -q "$APP_PACKAGE" emulator-activities.txt; then
            echo "ERROR: App package is not present in activity state after launch" | tee -a emulator-status.txt
            exit 1
          fi

          echo "PASS: App installed, launched and stayed alive without AndroidRuntime fatal crash" | tee -a emulator-status.txt
          EOF
          chmod +x emulator-test.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Boot emulator and launch-test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash emulator-test.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build108-emulator-evidence
          path: |
            emulator-status.txt
            emulator-launch.png
            emulator-logcat.txt
            emulator-activities.txt
            androidruntime-errors.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: warn

      - name: Upload APK only after emulator pass
        uses: actions/upload-artifact@v4
        with:
          name: Internetsiz-Yapay-Zeka-build108-EMULATOR-PASSED-apk
          path: project108/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
