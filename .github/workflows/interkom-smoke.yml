name: Interkom Launch Smoke Test
on:
  push:
    branches: [interkom-v01-first-apk, interkom-v02-livekit-cloud, flank-build3-auth-profile, flank-build3-google-redirect-fix, flank-build4-orange-ui]
    paths:
      - "interkom/**"
      - ".github/workflows/interkom-smoke.yml"
  workflow_dispatch:

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable APK
        working-directory: interkom
        run: gradle assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install and launch Interkom
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install interkom/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.example.interkom/.MainActivity
            sleep 10
            adb shell pidof com.example.interkom
            adb logcat -d -s AndroidRuntime:E > /tmp/interkom-crash.log
            ! grep -q "FATAL EXCEPTION" /tmp/interkom-crash.log
