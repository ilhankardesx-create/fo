name: Exact APK artifact runtime test

on:
  push:
    branches: [ "offline-ai-v1-build" ]
  workflow_dispatch:

jobs:
  exact-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Download exact fixed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Internetsiz-Yapay-Zeka-1.0
          path: exact-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ilhankardesx-create/fo
          run-id: 41463126525

      - name: Verify exact APK hash
        run: |
          set -euxo pipefail
          sha256sum exact-apk/Internetsiz-Yapay-Zeka-1.0.apk
          test "$(sha256sum exact-apk/Internetsiz-Yapay-Zeka-1.0.apk | awk '{print $1}')" = "b38200f697d8d25f19accd4a735fb598ccc3b45ff22412af8c0259d9fbf2045a"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install exact APK and verify launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r exact-apk/Internetsiz-Yapay-Zeka-1.0.apk
            adb logcat -c
            adb shell am force-stop com.internetsizyapayzeka.app2026
            adb shell am start -W -n com.internetsizyapayzeka.app2026/com.offlineai.app.MainActivity || true
            sleep 5
            echo '=== PROCESS ==='
            adb shell pidof com.internetsizyapayzeka.app2026 || true
            echo '=== CRASH LOG ==='
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.internetsizyapayzeka.app2026|com.offlineai.app|UnsatisfiedLinkError|SecurityException|Resources.NotFoundException' | tail -250 || true
            test -n "$(adb shell pidof com.internetsizyapayzeka.app2026 | tr -d '\r')"
