name: Build Offline AI 1.1

on:
  push:
    branches: [ "offline-ai-v1.1-build" ]
  workflow_dispatch:

jobs:
  build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore proven 1.0 source and apply only v1.1 feature patch
        run: |
          set -euxo pipefail
          cat \
            offline-ai-build/source_part_1.b64 \
            offline-ai-build/source_part_2.b64 \
            offline-ai-build/source_part_3a.b64 \
            offline-ai-build/source_part_3b.b64 \
            offline-ai-build/source_part_3c.b64 \
            offline-ai-build/source_part_3d.b64 \
            > /tmp/offline-ai-source.b64
          test "$(wc -c < /tmp/offline-ai-source.b64)" -eq 31304
          base64 --decode /tmp/offline-ai-source.b64 > /tmp/offline-ai-source.zip
          echo "7124caf66eb15d3306f5f8bad8802565500a2c9a8b67a2cb2397e0f3521e5dd2  /tmp/offline-ai-source.zip" | sha256sum -c -
          unzip -t /tmp/offline-ai-source.zip
          mkdir -p offlineai
          unzip -q /tmp/offline-ai-source.zip -d offlineai
          patch -d offlineai -p0 < offline-ai-build/v1.1-ui-history-theme.patch
          sed -i 's/@drawable\/app_icon_round/@drawable\/app_icon/g' offlineai/app/src/main/AndroidManifest.xml
          sed -i '/kotlinOptions { jvmTarget = "17" }/d' offlineai/app/build.gradle.kts
          sed -i 's/ScrollView\.LayoutParams(/FrameLayout.LayoutParams(/g' offlineai/app/src/main/java/com/offlineai/app/MainActivity.kt
          sed -i 's/isTextSelectable = true/setTextIsSelectable(true)/g' offlineai/app/src/main/java/com/offlineai/app/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('offlineai/app/src/main/java/com/offlineai/app/MainActivity.kt')
          s = p.read_text()
          old = "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n            window.insetsController?.setSystemBarsAppearance(0, WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS)\n        }\n"
          assert old in s, 'verified startup crash block not found'
          p.write_text(s.replace(old, '', 1))
          PY
          cat >> offlineai/app/build.gradle.kts <<'EOF'

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          EOF

      - name: Verify requested changes and release identity
        run: |
          set -euxo pipefail
          MAIN=offlineai/app/src/main/java/com/offlineai/app/MainActivity.kt
          grep 'applicationId = "com.internetsizyapayzeka.app2026"' offlineai/app/build.gradle.kts
          grep 'versionCode = 101' offlineai/app/build.gradle.kts
          grep 'versionName = "1.1"' offlineai/app/build.gradle.kts
          grep 'android:label="İnternetsiz Yapay Zeka"' offlineai/app/src/main/AndroidManifest.xml
          grep 'menu.add("Model İndir")' "$MAIN"
          grep 'menu.add("Sohbet geçmişi")' "$MAIN"
          grep 'menu.add("Tema")' "$MAIN"
          grep 'private fun showChatHistory()' "$MAIN"
          grep 'private fun showThemeDialog()' "$MAIN"
          grep 'KEY_CHAT_HISTORY' "$MAIN"
          grep 'Theme_OfflineAILight' "$MAIN"
          grep 'Cihazınızın RAM ve işlem gücüne göre model kullanın' "$MAIN"
          ! grep -q 'val topTitle' "$MAIN"
          ! grep -q 'window.insetsController' "$MAIN"
          grep 'LinearLayout.LayoutParams(dp(48), dp(48))' "$MAIN"
          grep 'moonlauncher/moon-models/resolve/main/gemma/gemma3-1b-it-int4.litertlm' "$MAIN"
          grep 'DownloadManager' "$MAIN"
          test -f offlineai/app/src/main/res/drawable-nodpi/app_icon.webp
          grep 'Theme.OfflineAILight' offlineai/app/src/main/res/values/themes.xml
          grep 'JvmTarget.JVM_17' offlineai/app/build.gradle.kts

      - name: Build APK normally with Gradle
        run: gradle -p offlineai :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -s offlineai/app/build/outputs/apk/debug/app-debug.apk
          unzip -t offlineai/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose offlineai/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging offlineai/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep "package: name='com.internetsizyapayzeka.app2026' versionCode='101' versionName='1.1'" /tmp/badging.txt
          grep "application-label:'İnternetsiz Yapay Zeka'" /tmp/badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Launch exact built APK in dark and light themes
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r offlineai/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.internetsizyapayzeka.app2026
            adb shell am start -W -n com.internetsizyapayzeka.app2026/com.offlineai.app.MainActivity
            sleep 5
            test -n "$(adb shell pidof com.internetsizyapayzeka.app2026 | tr -d '\r')"
            adb shell am force-stop com.internetsizyapayzeka.app2026
            adb shell 'run-as com.internetsizyapayzeka.app2026 mkdir -p shared_prefs'
            printf '%s\n' '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><boolean name="dark_theme" value="false" /></map>' | adb shell 'run-as com.internetsizyapayzeka.app2026 sh -c "cat > shared_prefs/offline_ai_prefs.xml"'
            adb logcat -c
            adb shell am start -W -n com.internetsizyapayzeka.app2026/com.offlineai.app.MainActivity
            sleep 5
            test -n "$(adb shell pidof com.internetsizyapayzeka.app2026 | tr -d '\r')"

      - name: Prepare APK
        run: |
          set -euxo pipefail
          cp offlineai/app/build/outputs/apk/debug/app-debug.apk Internetsiz-Yapay-Zeka-1.1.apk
          sha256sum Internetsiz-Yapay-Zeka-1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Internetsiz-Yapay-Zeka-1.1
          path: Internetsiz-Yapay-Zeka-1.1.apk
          if-no-files-found: error
