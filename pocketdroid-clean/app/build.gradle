plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketdroid.vm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pocketdroid.vm'
        minSdk 26
        targetSdk 35
        versionCode 80000
        versionName '0.8-diagnostics'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
